server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;   # or _ if you only use the IP

    root   /var/www/sites/main;
    index  index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;   # lets /about serve about.html
    }

    # Cache CSS/JS/images
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Block hidden files like .git
    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
}