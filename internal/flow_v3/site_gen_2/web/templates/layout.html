<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - {{.SiteName}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="/">
      <img src="/static/img/logo.svg" alt="" width="28" height="28">
      <span>{{.SiteName}}</span>
    </a>
    <nav aria-label="Main">
      {{range .Nav}}<a href="{{.Path}}"{{if .Active}} class="active" aria-current="page"{{end}}>{{.Label}}</a>
      {{end}}
    </nav>
  </div>
</header>
<main>
  <article class="prose">{{.Content}}</article>
</main>
<footer class="site-footer">
  <div class="inner">
    <span>{{.SiteName}} &copy; {{.Year}}</span>
    <span class="muted">Humans and machines, one network.</span>
  </div>
</footer>
</body>
</html>
