version: "2"
sql:
  - engine: "sqlite"
    schema: "db/migrations"
    queries: "db/queries"
    gen:
      go:
        package: "queuedb"
        out: "internal/queuedb"
        emit_json_tags: true
        emit_interface: true          # Querier interface -> easy to mock
        emit_empty_slices: true
        emit_pointers_for_null_types: true   # *string / *int64 instead of sql.NullString
        emit_result_struct_pointers: false
